plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'com.diffplug.spotless' version '6.25.0'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// 本机使用 brew JDK 21；通过 --release 17 保证产出 Java 17 兼容字节码
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    // 国内镜像：maven central
    maven { url = uri('https://maven.aliyun.com/repository/public') }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"


    // 本模组**刻意没有外部模组依赖**（无 MCEF / 无原生库）：动画背景靠 JDK 自带的
    // ImageIO（GIF 解码）+ Minecraft 自己的贴图管线实现，见 docs/02。

    // ---- 测试（JUnit5；离线开发环境不自动跑，显式 `-PrunTests` 才执行）----
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_group_id,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_group_id,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                // 混入配置**只能**在这里声明。写进 mods.toml 是无效的：
                // 那个键不在顶层（`[[mods]]` / `[[dependencies.*]]` 之后的裸键都属于上面那张表），
                // 而且被**静默忽略**——症状是混入一条都不生效，日志里既没有生效提示也没有报错。
                // 实例里每个能用的模组都走 manifest，见 AGENTS.md「构建环境」那条。
                'MixinConfigs'            : 'ccnr_menu.mixins.json'
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    // 语法/类型检查增强（警告不阻断构建；配合 CI 门禁使用）
    options.compilerArgs += ['-Xlint:all']
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    onlyIf { project.hasProperty('runTests') }
    // GIF 解码走 AWT（headless 即可，不弹窗、不碰 GPU）
    systemProperty 'java.awt.headless', 'true'
}

// ---- 代码风格（spotless：palantirJavaFormat + license 头）----
spotless {
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
        palantirJavaFormat()
        licenseHeaderFile 'config/spotless/license-header.txt'
        trimTrailingWhitespace()
        endWithNewline()
    }
}
