name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build with Gradle (incl. spotlessCheck)
        run: ./gradlew build --no-daemon

      # 测试默认被 onlyIf -PrunTests 跳过，必须显式带上，否则 CI 会在「没有任何测试」的情况下变绿。
      # 本仓库的门禁（VersionConsistencyTest / LangFileTest / MenuScreenMappingTest /
      # GifDecoderTest / MenuConfigTest）都在这条命令里。
      - name: Run unit tests
        run: ./gradlew test -PrunTests --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ccnr_menu
          path: build/libs/*.jar

      # 版本号唯一真源是 gradle.properties，所以「合进 main」就等于发版：
      # tag 不存在就顺手建，不需要谁记得手动打 tag（手动打 tag 走同一条路，--clobber 保证幂等）。
      # PR 不发版。
      - name: Publish GitHub Release (version from gradle.properties)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -E "^mod_version=" gradle.properties | cut -d= -f2)
          TAG="v${VERSION}"
          JAR="build/libs/ccnr_menu-${VERSION}.jar"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "CCNR-Menu ${VERSION}" --generate-notes
          gh release upload "$TAG" "$JAR" --clobber
          echo "已发布 $TAG → $(basename "$JAR")"
