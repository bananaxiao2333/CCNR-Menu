modLoader="javafml"
loaderVersion="[47,)"
license="MIT"

[[mods]]
modId="ccnr_menu"
version="${file.jarVersion}"
displayName="CCNR-Menu"
authors="CCNR"
description='''CCNR 主菜单自定义模组（Forge 1.20.1，纯客户端）

用一份 JSON 配置改掉主菜单：背景（静态图 / 动画 GIF / 精灵图序列帧 / 纯色 / 原版全景图）、
配色、标题、按钮的文字·位置·动作。改完执行 /ccnr_menu reload 即可生效，不用重新编译。

- 零外部依赖：动画 GIF 用 JDK 自带的 ImageIO 解码，精灵图走原版贴图管线，
  不需要 MCEF 之类的浏览器引擎，也不需要任何原生库
- 只改客户端，服务端装不装都一样；enabled=false 立刻回到纯原版主菜单

配置与背景文件都在 config/ccnr_menu/。执行 /ccnr_menu status 可以看到当前读到的一切。'''

[[dependencies.ccnr_menu]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.ccnr_menu]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="CLIENT"

# 混入配置由 build.gradle 写进 MANIFEST.MF 的 `MixinConfigs`，**不要**加回这个文件：
# 放在这里（`[[dependencies.*]]` 之后的裸键）在 TOML 里属于上面那张表，Forge 读不到顶层键，
# 于是混入被**静默**忽略——一条都不生效，日志里既没有生效提示也没有报错。
# 详见 AGENTS.md 与 docs/02 §1.4。
# 拦的是「泥土背景到底画不画」这个最底层的收口处（Screen.renderDirtBackground）：
# 1.20.1 的 ScreenEvent.Render.Pre/Post 声明了但根本没被触发，而加载类界面
# （ProgressScreen / LevelLoadingScreen / ReceivingLevelScreen）自己画泥土、也不调 super.render()。
